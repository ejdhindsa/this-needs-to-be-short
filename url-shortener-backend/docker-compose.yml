services:
  db:
    image: postgres:16
    container_name: shortener_db
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - shortener_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shortener:
    build: .
    container_name: shortener_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge

volumes:
  shortener_pg_data:

networks:
  edge:
    external: true
